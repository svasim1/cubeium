plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

configurations {
	// Source code of the bundled LGPL bindings, shipped inside the mod jar (see licenses/NOTICE.txt).
	bindingsSources { transitive = false }
}

repositories {
	// cubiomes Java bindings (FFM) with bundled natives, https://github.com/xpple/cubiomes/tree/java-bindings
	maven {
		name = 'xpple'
		url = 'https://maven.xpple.dev/maven2'
		content { includeGroup 'dev.xpple' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cubeium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// In-game tests (src/gametest): ./gradlew runClientGameTest launches the real client.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "cubeium-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Bundled into the mod jar (jar-in-jar); the version pins the cubiomes commit after the '+'.
	include implementation("dev.xpple:cubiomes:${project.cubiomes_version}")
	bindingsSources "dev.xpple:cubiomes:${project.cubiomes_version}:sources"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Unit tests exercise the client-side cubiomes bindings (no Minecraft needed).
sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

test {
	useJUnitPlatform()
	// The bindings call restricted FFM methods; allow them without warnings.
	jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// The Java source of the bundled bindings, without the prebuilt natives that the sources jar repeats.
def bindingsSourceZip = tasks.register("bindingsSourceZip", Zip) {
	archiveFileName = "cubiomes-bindings-${project.cubiomes_version}-sources.zip"
	destinationDirectory = layout.buildDirectory.dir("bindingsSources")
	from({ zipTree(configurations.bindingsSources.singleFile) }) {
		include "**/*.java"
	}
}

jar {
	def projectName = project.base.archivesName.get()
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	// LGPL-3.0 obligations for the bundled cubiomes bindings: license texts, notice and source.
	def bindingsVersion = project.cubiomes_version
	inputs.property "bindingsVersion", bindingsVersion
	into("META-INF/licenses/cubiomes-bindings") {
		from("licenses") {
			filesMatching("NOTICE.txt") {
				expand bindingsVersion: bindingsVersion, cubiomesCommit: bindingsVersion.substring(bindingsVersion.indexOf('+') + 1)
			}
		}
		from(bindingsSourceZip)
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
